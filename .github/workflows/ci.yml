name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check app tests
      - run: ruff check app tests

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -p no:warnings -q

  # The suite on PostgreSQL, connected as an ordinary role so that Row-Level Security applies
  # (superusers skip it), plus the migrations from scratch and a model/migration drift check.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Create the application role and databases
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE novalyn_app LOGIN PASSWORD 'novalyn_app' NOSUPERUSER NOBYPASSRLS"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE novalyn_test OWNER novalyn_app"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE novalyn_migrations OWNER novalyn_app"
      - name: Migrations from scratch, down and up again, no drift
        env:
          DATABASE_URL: postgresql://novalyn_app:novalyn_app@localhost:5432/novalyn_migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql://novalyn_app:novalyn_app@localhost:5432/novalyn_test
        run: python -m pytest -p no:warnings -q
      - name: Install the PostgreSQL 18 client (pg_dump must not be older than the server)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Backup and restore round trip
        env:
          SEED_PASSWORD: Harbor-Lantern-4821
        run: |
          export DATABASE_URL=postgresql://novalyn_app:novalyn_app@localhost:5432/novalyn_migrations
          python -m app.cli seed
          bash scripts/backup.sh /tmp/backups
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE novalyn_restore OWNER novalyn_app"
          DATABASE_URL=postgresql://novalyn_app:novalyn_app@localhost:5432/novalyn_restore \
            bash scripts/restore.sh "$(ls -t /tmp/backups/*.dump | head -1)"

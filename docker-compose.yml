# NOVALYN full stack for local use: PostgreSQL, Redis, API, worker, web and a
# development mailbox. Start with:  docker compose up --build
# Then open http://localhost:8080 (app) and http://localhost:8025 (mailbox).
#
# The passwords below are local-only defaults. Production values come from
# your secret manager; see DEPLOYMENT.md.

x-backend-env: &backend-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql://novalyn:${POSTGRES_PASSWORD:-novalyn-local}@postgres:5432/novalyn
  REDIS_URL: redis://redis:6379/0
  CELERY_TASK_ALWAYS_EAGER: "false"
  SECRET_KEY: ${SECRET_KEY:-local-compose-secret-key-change-me-0000000000}
  FRONTEND_URL: http://localhost:8080
  CORS_ORIGINS: http://localhost:8080
  EMAIL_BACKEND: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_USE_TLS: "false"
  FORWARDED_ALLOW_IPS: "*"
  LOG_JSON: "true"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: novalyn
      POSTGRES_USER: novalyn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novalyn-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novalyn -d novalyn"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  migrate:
    build: .
    command: alembic upgrade head
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2
    environment: *backend-env
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A app.workers.celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    environment: *backend-env
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build: ../novalyn-frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres-data:
